name: Update README cards

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-readme-cards.yml

permissions:
  contents: write

concurrency:
  group: update-readme-cards
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v6

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&include_all_commits=true&show_icons=true&theme=github_dark
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
          fail_on_error: true

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=github_dark&hide=php&exclude_repo=app-engine-rmd,ati-server,auto-light-probes,poloniexlendingbot,PostProcessing,unity3d-marsxplr
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
          fail_on_error: true

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update profile cards"
          git push
