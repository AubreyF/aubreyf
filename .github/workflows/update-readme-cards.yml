name: Update README cards

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-readme-cards.yml

permissions:
  contents: write

concurrency:
  group: update-readme-cards
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v6

      - name: Generate GitHub stats
        env:
          PROFILE_USERNAME: ${{ github.repository_owner }}
        # The repository token limits commit search to this repository.
        # The public renderer also includes anonymous private contribution counts.
        run: |
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 45 \
            --get 'https://github-stats-extended.vercel.app/api' \
            --data-urlencode "username=$PROFILE_USERNAME" \
            --data-urlencode 'include_all_commits=true' \
            --data-urlencode 'include_contributions=true' \
            --data-urlencode 'show=contributions' \
            --data-urlencode 'show_icons=true' \
            --data-urlencode 'theme=github_dark' \
            --output profile/stats.svg.tmp
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          card = Path("profile/stats.svg.tmp")
          svg = card.read_text()
          root = ET.fromstring(svg)
          # Error cards can also return HTTP 200. Preserve the published card on failure.
          for metric in ("commits", "contributions"):
              node = next((node for node in root.iter()
                           if node.get("data-testid") == metric), None)
              if node is None or not node.text or node.text.strip() == "0":
                  raise SystemExit(f"Stats renderer returned missing or zero {metric}")
              print(f"All-time {metric}: {node.text.strip()}")
          # Distinguish public commits from contributions that include private activity.
          svg = svg.replace("Total Commits", "Public Commits")
          svg = svg.replace("Total Contributions", "All-time Contributions")
          card.write_text(svg)
          card.replace("profile/stats.svg")
          PYTHON

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=github_dark&hide=php&exclude_repo=app-engine-rmd,ati-server,auto-light-probes,poloniexlendingbot,PostProcessing,unity3d-marsxplr
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
          fail_on_error: true

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update profile cards"
          git push
